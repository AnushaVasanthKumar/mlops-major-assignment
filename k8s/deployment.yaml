apiVersion: apps/v1
kind: Deployment
metadata:
  name: olivetti-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: olivetti-app
  template:
    metadata:
      labels:
        app: olivetti-app
    spec:
      containers:
      - name: olivetti-container
        image: anushavasanthkumar95/olivetti-mlops:latest
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: olivetti-service
spec:
  type: NodePort
  selector:
    app: olivetti-app
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080
